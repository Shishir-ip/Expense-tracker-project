<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Expense Tracker</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1rem;
        }
        .auth-box {
            background: rgba(255,255,255,0.95);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            max-width: 420px;
            width: 100%;
            animation: slideUp 0.5s ease-out;
        }
        .auth-title {
            font-size: 1.75rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1e293b;
            font-size: 0.9rem;
        }
        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .auth-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
        }
        .auth-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background: #d1fae5;
            color: #059669;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .step-section {
            display: none;
        }
        .step-section.show {
            display: block;
        }
        .otp-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.25rem;
            text-align: center;
            letter-spacing: 0.5rem;
            font-weight: 700;
        }
        .info-note {
            background: #eff6ff;
            color: #1e40af;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1 class="auth-title">Reset Password</h1>
            <p class="auth-subtitle">Recover your account access</p>
            
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <!-- Step 1: Request Reset -->
            <div id="step1" class="step-section show">
                <div class="info-note">
                    <i class="fas fa-info-circle"></i> Enter your email or username to receive a reset code
                </div>
                
                <form id="requestForm">
                    <div class="form-group">
                        <label class="form-label">Email or Username</label>
                        <input type="text" id="identifier" class="form-input" placeholder="Enter email or username" required>
                    </div>
                    
                    <button type="submit" class="btn-primary" id="requestBtn">
                        <span>Send Reset Code</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
            
            <!-- Step 2: Verify OTP and Reset PIN -->
            <div id="step2" class="step-section">
                <div class="info-note">
                    <i class="fas fa-check-circle"></i> Enter the code sent to your email
                </div>
                
                <form id="resetForm">
                    <div class="form-group">
                        <label class="form-label">Reset Code (OTP)</label>
                        <input type="text" id="otpInput" class="otp-input" placeholder="000000" maxlength="6" pattern="\d{6}" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">New PIN (6 digits)</label>
                        <input type="password" id="newPin" class="form-input" placeholder="Enter new 6-digit PIN" maxlength="6" pattern="\d{6}" required>
                    </div>
                    
                    <button type="submit" class="btn-primary" id="resetBtn">
                        <span>Reset Password</span>
                        <i class="fas fa-key"></i>
                    </button>
                </form>
            </div>
            
            <div class="auth-links">
                <p><a href="/login">Back to Login</a></p>
                <p style="margin-top: 0.5rem;"><a href="/">Back to Home</a></p>
            </div>
        </div>
    </div>

    <script src="/src/js/config.js"></script>
    <script src="/src/js/auth.js"></script>
    <script>
        initSupabase();
        
        if (isAuthenticated()) {
            window.location.href = '/';
        }
        
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        
        let pendingIdentifier = '';
        
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }
        
        function showSuccess(msg) {
            successMessage.textContent = msg;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }
        
        // Step 1: Request password reset
        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identifier = document.getElementById('identifier').value.trim();
            
            if (!identifier) {
                showError('Please enter your email or username');
                return;
            }
            
            const requestBtn = document.getElementById('requestBtn');
            requestBtn.disabled = true;
            requestBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            
            try {
                const result = await requestPasswordReset(identifier);
                
                if (result.error) {
                    showError(result.error);
                    requestBtn.disabled = false;
                    requestBtn.innerHTML = '<span>Send Reset Code</span><i class="fas fa-paper-plane"></i>';
                } else {
                    showSuccess(result.message);
                    pendingIdentifier = identifier;
                    
                    // Move to step 2
                    setTimeout(() => {
                        step1.classList.remove('show');
                        step2.classList.add('show');
                        
                        // Demo mode alert
                        setTimeout(() => {
                            alert('DEMO MODE: Check browser console for reset OTP code');
                        }, 500);
                    }, 1500);
                }
            } catch (err) {
                showError('An unexpected error occurred');
                requestBtn.disabled = false;
                requestBtn.innerHTML = '<span>Send Reset Code</span><i class="fas fa-paper-plane"></i>';
            }
        });
        
        // Step 2: Reset password with OTP
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const otp = document.getElementById('otpInput').value.trim();
            const newPin = document.getElementById('newPin').value.trim();
            
            if (!otp || !/^\d{6}$/.test(otp)) {
                showError('Please enter a valid 6-digit reset code');
                return;
            }
            
            if (!newPin || !/^\d{6}$/.test(newPin)) {
                showError('New PIN must be exactly 6 digits');
                return;
            }
            
            const resetBtn = document.getElementById('resetBtn');
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
            
            try {
                const result = await resetPassword(pendingIdentifier, otp, newPin);
                
                if (result.error) {
                    showError(result.error);
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = '<span>Reset Password</span><i class="fas fa-key"></i>';
                } else {
                    showSuccess(result.message);
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                }
            } catch (err) {
                showError('Failed to reset password');
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<span>Reset Password</span><i class="fas fa-key"></i>';
            }
        });
    </script>
</body>
</html>
